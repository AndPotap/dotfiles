[env]
TERM = "screen-256color"

[terminal.shell]
program = "/bin/bash"
args = ["--login", "-i"]

[font]
size = 15.0

[font.bold]
family = "Menlo"
style = "Bold"

[font.italic]
family = "Menlo"
style = "Italic"

[font.normal]
family = "Menlo"
style = "Regular"

[colors]
draw_bold_text_with_bright_colors = false

[[colors.indexed_colors]]
color = "0xff9e64"
index = 16

[[colors.indexed_colors]]
color = "0xdb4b4b"
index = 17

[colors.bright]
black = "0x414868"
blue = "0x7aa2f7"
cyan = "0x7dcfff"
green = "0x9ece6a"
magenta = "0xbb9af7"
red = "0xf7768e"
white = "0xc0caf5"
yellow = "0xe0af68"

[colors.normal]
black = "0x1D202F"
blue = "0x7aa2f7"
cyan = "0x7dcfff"
green = "0x9ece6a"
magenta = "0xbb9af7"
red = "0xf7768e"
white = "0xa9b1d6"
yellow = "0xe0af68"

[colors.primary]
background = "0x24283b"
foreground = "0xc0caf5"

[cursor]
style = "Block"
unfocused_hollow = true

[scrolling]
history = 10000
multiplier = 3

[window]
startup_mode = "Maximized"
decorations = "none"
dynamic_padding = true
opacity = 1.0

[window.padding]
x = 10
y = 10

[keyboard]
bindings = [
  { key = "A", mods = "Command", chars = "\u0001" },
  { key = "B", mods = "Command", chars = "\u0002" },
  { key = "D", mods = "Command", chars = "\u0004" },
  { key = "E", mods = "Command", chars = "\u0005" },
  { key = "F", mods = "Command", chars = "\u0006" },
  { key = "G", mods = "Command", chars = "\u0007" },
  { key = "H", mods = "Command", chars = "\u0008" },
  { key = "I", mods = "Command", chars = "\u0009" },
  { key = "J", mods = "Command", chars = "\u000A" },
  { key = "K", mods = "Command", chars = "\u000B" },
  { key = "L", mods = "Command", chars = "\u000C" },
  { key = "M", mods = "Command", chars = "\u000D" },
  # { key = "N", mods = "Command", chars = "\u000E" },
  { key = "N", mods = "Command", action = "CreateNewWindow" },
  { key = "O", mods = "Command", chars = "\u000F" },
  { key = "P", mods = "Command", chars = "\u0010" },
  { key = "Q", mods = "Command", chars = "\u0011" },
  { key = "R", mods = "Command", chars = "\u0012" },
  { key = "S", mods = "Command", chars = "\u0013" },
  { key = "T", mods = "Command", chars = "\u0014" },
  { key = "U", mods = "Command", chars = "\u0015" },
  { key = "W", mods = "Command", chars = "\u0017" },
  { key = "X", mods = "Command", chars = "\u0018" },
  { key = "Y", mods = "Command", chars = "\u0019" },
  { key = "Z", mods = "Command", chars = "\u001A" },
]
